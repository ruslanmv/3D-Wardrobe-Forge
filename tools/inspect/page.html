<!doctype html><html><head><!-- Fit inspection (tools/inspect): the gallery page, plus ?mannequin=: the body drawn as a matte grey dress form, garments in their own materials. Local QA only, never the catalogue. --><style>html,body{margin:0;height:100%;background:#26232a}#v{position:absolute;inset:0}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.4/lib/three-vrm.module.min.js"}}</script>
</head><body><div id="v"></div><script type="module">
import * as THREE from 'three';
import { Viewer } from './viewer.js';
const v = new Viewer(document.getElementById('v'));
const q = new URLSearchParams(location.search);
v.frame = () => place();
await v.load('original', q.get('a'));
v.setPose('relaxed');
// ?mannequin=["Garment name", ...]: every material whose name does not start with a planned
// garment's name is her body (skin, face, hair) and is drawn as one matte grey, so the eye goes
// to the garment's edges, straps and where it meets her, not to her texture.
if (q.get('mannequin')) {
  const garments = JSON.parse(q.get('mannequin'));
  const form = new THREE.MeshStandardMaterial({ color: 0x9c9a98, roughness: 0.92, metalness: 0 });
  v.slots.original.vrm.scene.traverse((object) => {
    if (!object.isMesh) return;
    const swap = (m) => (garments.some((g) => (m.name || '').startsWith(g)) ? m : form);
    object.material = Array.isArray(object.material) ? object.material.map(swap) : swap(object.material);
  });
}
// SA4. ?bones={"leftUpperArm":[x,y,z,w],...} poses normalized bones instead (the anatomy pose tests;
// tools/anatomy/render_reference.py computes them); ?bones=rest is the bind pose. A bone it names
// replaces the relaxed rotation. Absent: the relaxed pose, so every earlier render is unchanged.
if (q.get('bones')) {
  const rest = q.get('bones') === 'rest';
  if (rest) v.setPose('rest');
  for (const [bone, quat] of Object.entries(rest ? {} : JSON.parse(q.get('bones')))) {
    const node = v.slots.original.vrm.humanoid.getNormalizedBoneNode(bone);
    if (node) node.quaternion.set(quat[0], quat[1], quat[2], quat[3]);
  }
}
function place() {
// Frame by height: the rest-pose bounds include arms out in a T, not the A-pose drawn,
// but their height is hers whatever her arms do. A VRoid girl is 1.5 m, the mannequin 1.83.
const box = new THREE.Box3().setFromObject(v.slots.original.vrm.scene);
// ?ortho=1 (G7, garment_review.py): a 1.5° lens from far away, near enough parallel that a box
// reads as a box. Absent, every earlier render is unchanged.
const ortho = Boolean(q.get('ortho'));
if (ortho) { v.camera.fov = 1.5; v.camera.updateProjectionMatrix(); v.controls.maxDistance = 1e4; }
const height = Math.max(box.max.y, 0.5), fov = THREE.MathUtils.degToRad(v.camera.fov);
const distance = (height * 0.56) / Math.tan(fov / 2);
const yaw = Number(q.get('yaw') || 0) * Math.PI / 180;
// ?elev= degrees above (positive) or below (negative) her, for the focus view: what a phone held
// low sees, where a seam between the legs shows. Absent, 0: every earlier render is unchanged.
const elev = Number(q.get('elev') || 0) * Math.PI / 180;
// ?focus=y0,y1 frames that band of heights instead (the hem close-up): its height fills the frame.
const focus = (q.get('focus') || '').split(',').map(Number).filter((n) => Number.isFinite(n));
if (focus.length === 2) {
  const span = Math.max(focus[1] - focus[0], 0.05), mid = (focus[0] + focus[1]) / 2;
  const near = (span * 0.56) / Math.tan(fov / 2);
  // ?fx= and ?fz= move the point looked at off her midline (a shoulder close-up). Absent, 0.
  const fx = Number(q.get('fx') || 0), fz = Number(q.get('fz') || 0);
  v.controls.target.set(fx, mid, fz);
  const flat = Math.cos(elev) * near;
  v.camera.position.set(fx + Math.sin(yaw) * flat, mid + Math.sin(elev) * near, fz + Math.cos(yaw) * flat);
  v.camera.near = 0.02; v.camera.far = near * 10; v.camera.updateProjectionMatrix();
  v.controls.update();
  return;
}
v.controls.target.set(0, height * 0.5, 0);
v.camera.position.set(Math.sin(yaw) * distance, height * 0.55, Math.cos(yaw) * distance);
v.camera.near = ortho ? distance * 0.5 : 0.05; v.camera.far = distance * 10; v.camera.updateProjectionMatrix();
v.controls.update();
}
place();
await new Promise((r) => setTimeout(r, 300));
place();
window.ready = true;
</script></body></html>
