<!doctype html><html><head><!-- The gallery page: one look, framed by height, A-pose, camera at ?yaw= degrees. --><style>html,body{margin:0;height:100%;background:#26232a}#v{position:absolute;inset:0}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.4/lib/three-vrm.module.min.js"}}</script>
</head><body><div id="v"></div><script type="module">
import * as THREE from 'three';
import { Viewer } from './viewer.js';
const v = new Viewer(document.getElementById('v'));
const q = new URLSearchParams(location.search);
v.frame = () => place();
await v.load('original', q.get('a'));
v.setPose('relaxed');
// PR1. ?present={"mode":"form"|"ghost","product":["Garment name", ...]}: the product view.
// Fitting is untouched; this only decides what is drawn. A material whose name starts with a
// product garment's name is the product, in its own material. VRoid marks her body by role
// (_SKIN, _FACE, _EYE, _HAIR): on the form it is one matte grey, in ghost mode it is hidden.
// Everything else (the nude base set the piece was fitted over, clothes of her own) is hidden.
// Absent, every earlier render is unchanged.
if (q.get('present')) {
  const present = JSON.parse(q.get('present'));
  const isProduct = (m) => present.product.some((g) => (m.name || '').startsWith(g));
  const isBody = (m) => /_(SKIN|FACE|EYE|HAIR)\b|_(SKIN|FACE|EYE|HAIR) /.test(m.name || '');
  const form = new THREE.MeshStandardMaterial({ color: present.formColor || 0xa9a5a1, roughness: 0.9 });
  v.slots.original.vrm.scene.traverse((object) => {
    if (!object.isMesh) return;
    const list = Array.isArray(object.material) ? object.material : [object.material];
    const kept = list.map((m) => {
      if (isProduct(m)) {
        // ?present.shading="standard": the same colour, texture and alpha on a lit PBR material,
        // so studio light models the fabric (MToon is a toon shader and barely shows it).
        let out = m;
        if (present.shading === 'standard') {
          out = new THREE.MeshStandardMaterial({
            color: m.color ? m.color.clone() : 0xffffff, map: m.map || null,
            transparent: Boolean(m.transparent), opacity: m.opacity ?? 1, alphaTest: m.alphaTest || 0,
            roughness: present.roughness ?? 0.62, metalness: 0, side: m.side,
          });
          out.name = m.name;
        }
        // PR2. Engineering views of the product alone: its per-vertex colours (a measured
        // clearance or strain written into COLOR_0 by tools/inspect/pose_contact.py), or its
        // triangles as a wireframe. Absent, the product is drawn as above.
        if (present.vertexColors) {
          out = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.8, side: THREE.DoubleSide });
          out.name = m.name;
        }
        if (present.wireframe) {
          out = new THREE.MeshBasicMaterial({ color: 0x1b2633, wireframe: true });
          out.name = m.name;
        }
        if (present.mode === 'ghost') out.side = THREE.DoubleSide;
        return out;
      }
      if (isBody(m) && present.mode === 'form') return form;
      return null;
    });
    if (kept.every((m) => m === null)) { object.visible = false; return; }
    // A mesh holding several materials keeps its groups; a hidden one draws nothing.
    const hidden = new THREE.MeshBasicMaterial({ visible: false });
    const out = kept.map((m) => m || hidden);
    object.material = Array.isArray(object.material) ? out : out[0];
  });
}
// PR1. ?light=studio: a soft key, a fill from the other side and a rim, on a light neutral
// background, so a black garment separates from it. Absent, the gallery's own lights.
if (q.get('light') === 'studio') {
  document.body.style.background = '#d6d1cc';
  if (v.renderer) v.renderer.setClearColor(0xd6d1cc, 1);
  const fill = new THREE.DirectionalLight(0xffffff, 0.9); fill.position.set(-2.5, 1.6, 2.0);
  const key = new THREE.DirectionalLight(0xfff4ec, 1.2); key.position.set(2.0, 2.4, 2.6);
  const rim = new THREE.DirectionalLight(0xffffff, 0.8); rim.position.set(0, 2.0, -3.0);
  v.scene.add(fill, key, rim, new THREE.AmbientLight(0xffffff, 0.35));
}
// SA4. ?bones={"leftUpperArm":[x,y,z,w],...} poses normalized bones instead (the anatomy pose tests;
// tools/anatomy/render_reference.py computes them); ?bones=rest is the bind pose. A bone it names
// replaces the relaxed rotation. Absent: the relaxed pose, so every earlier render is unchanged.
if (q.get('bones')) {
  const rest = q.get('bones') === 'rest';
  if (rest) v.setPose('rest');
  for (const [bone, quat] of Object.entries(rest ? {} : JSON.parse(q.get('bones')))) {
    const node = v.slots.original.vrm.humanoid.getNormalizedBoneNode(bone);
    if (node) node.quaternion.set(quat[0], quat[1], quat[2], quat[3]);
  }
}
function place() {
// Frame by height: the rest-pose bounds include arms out in a T, not the A-pose drawn,
// but their height is hers whatever her arms do. A VRoid girl is 1.5 m, the mannequin 1.83.
const box = new THREE.Box3().setFromObject(v.slots.original.vrm.scene);
// ?ortho=1 (G7, garment_review.py): a 1.5° lens from far away, near enough parallel that a box
// reads as a box. Absent, every earlier render is unchanged.
const ortho = Boolean(q.get('ortho'));
if (ortho) { v.camera.fov = 1.5; v.camera.updateProjectionMatrix(); v.controls.maxDistance = 1e4; }
const height = Math.max(box.max.y, 0.5), fov = THREE.MathUtils.degToRad(v.camera.fov);
const distance = (height * 0.56) / Math.tan(fov / 2);
const yaw = Number(q.get('yaw') || 0) * Math.PI / 180;
// ?elev= degrees above (positive) or below (negative) her, for the focus view: what a phone held
// low sees, where a seam between the legs shows. Absent, 0: every earlier render is unchanged.
const elev = Number(q.get('elev') || 0) * Math.PI / 180;
// ?focus=y0,y1 frames that band of heights instead (the hem close-up): its height fills the frame.
const focus = (q.get('focus') || '').split(',').map(Number).filter((n) => Number.isFinite(n));
if (focus.length === 2) {
  const span = Math.max(focus[1] - focus[0], 0.05), mid = (focus[0] + focus[1]) / 2;
  const near = (span * 0.56) / Math.tan(fov / 2);
  // ?fx= and ?fz= move the point looked at off her midline (a shoulder close-up). Absent, 0.
  const fx = Number(q.get('fx') || 0), fz = Number(q.get('fz') || 0);
  v.controls.target.set(fx, mid, fz);
  const flat = Math.cos(elev) * near;
  v.camera.position.set(fx + Math.sin(yaw) * flat, mid + Math.sin(elev) * near, fz + Math.cos(yaw) * flat);
  v.camera.near = 0.02; v.camera.far = near * 10; v.camera.updateProjectionMatrix();
  v.controls.update();
  return;
}
v.controls.target.set(0, height * 0.5, 0);
v.camera.position.set(Math.sin(yaw) * distance, height * 0.55, Math.cos(yaw) * distance);
v.camera.near = ortho ? distance * 0.5 : 0.05; v.camera.far = distance * 10; v.camera.updateProjectionMatrix();
v.controls.update();
}
place();
await new Promise((r) => setTimeout(r, 300));
place();
window.ready = true;
</script></body></html>
