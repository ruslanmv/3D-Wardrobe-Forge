[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-wardrobe-forge"
version = "0.2.0"
description = "Outfit generation for VRM avatars: a VRM plus a prompt in, a validated VRM out"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ruslanmv" }]
keywords = ["vrm", "avatar", "3d", "clothing", "blender", "gltf"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
# Preview rendering without Blender.
preview = ["pillow>=10.3,<12"]
# S3-compatible artifact storage.
s3 = ["boto3>=1.34,<2"]
# Multi-process job queue.
redis = ["redis>=5.0,<7"]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "pillow>=10.3,<12",
]
all = [
  "3d-wardrobe-forge[preview,s3,redis]",
]

[project.scripts]
wardrobe-forge = "apps.cli:main"

[project.urls]
Homepage = "https://github.com/ruslanmv/3D-Wardrobe-Forge"
Documentation = "https://github.com/ruslanmv/3D-Wardrobe-Forge/tree/main/docs"

[tool.setuptools.packages.find]
include = ["apps*", "wardrobe*", "worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "slow: long-running acceptance matrix",
]

[tool.ruff]
line-length = 110
target-version = "py311"
# Blender modules import bpy, which only exists inside Blender.
extend-exclude = ["worker/blender"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "B008",  # FastAPI's Depends()/File() defaults are the documented idiom
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
