name: Nightly provider smoke

# The AI mesh providers are third-party APIs whose request and response shapes
# we do not control. This job exists so a breaking change upstream is caught
# here rather than by a user's failed job.
#
# It is skipped unless the corresponding secret is configured, so forks and
# contributors never see it fail.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Which provider to exercise"
        required: false
        default: "all"
        type: choice
        options: ["all", "meshy", "tripo"]
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: provider-smoke
  cancel-in-progress: false

jobs:
  contract:
    # Always runs: proves the adapters still parse the payload shapes we expect,
    # without calling anything or needing a key.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Provider response parsing
        run: pytest tests/unit/test_providers.py -q

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        provider: [meshy, tripo]
    steps:
      - uses: actions/checkout@v4

      - name: Is this provider configured?
        id: configured
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
          TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
        run: |
          case "${{ matrix.provider }}" in
            meshy) key="$MESHY_API_KEY" ;;
            tripo) key="$TRIPO_API_KEY" ;;
          esac
          if [ -n "$key" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no API key configured for ${{ matrix.provider }}; skipping the live call"
          fi

      - uses: actions/setup-python@v5
        if: steps.configured.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install -e ".[dev,preview]"
        if: steps.configured.outputs.run == 'true'

      - name: Submit one real generation and check the contract
        if: steps.configured.outputs.run == 'true'
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
          TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
          WARDROBE_PROVIDER: ${{ matrix.provider }}
          PROVIDER_TIMEOUT_S: "1500"
        run: |
          python - <<'PY'
          import asyncio, os, sys

          from wardrobe.config import get_settings
          from wardrobe.domain.garments import TemplateCatalog
          from wardrobe.domain.looks import OutfitRequest
          from wardrobe.pipeline.plan_outfit import plan_outfit
          from wardrobe.providers import create_provider

          async def main() -> int:
              settings = get_settings()
              catalog = TemplateCatalog.from_directory(settings.template_root_path)
              plan = plan_outfit(OutfitRequest(prompt="simple black a-line dress"), catalog)

              provider = create_provider(os.environ["WARDROBE_PROVIDER"], settings, catalog)
              try:
                  artifact = await provider.create(plan, template=catalog.get(plan.template_id))
                  print("artifact:", artifact.id, artifact.source)
                  if not artifact.mesh_path:
                      return "provider returned no mesh url"

                  data = await provider.download_mesh(artifact)
                  print(f"downloaded {len(data)} bytes")
                  if data[:4] != b"glTF":
                      return f"provider returned {data[:16]!r}, not a GLB"
              finally:
                  await provider.aclose()
              return 0

          sys.exit(asyncio.run(main()))
          PY

      - name: Open an issue when the contract breaks
        if: failure() && steps.configured.outputs.run == 'true' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Provider smoke failed: ${{ matrix.provider }}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'provider-smoke',
            });
            if (existing.data.some((issue) => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['provider-smoke'],
              body: [
                `The nightly smoke test against **${{ matrix.provider }}** failed.`,
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'This usually means the provider changed its request or response shape.',
                'The adapter lives in `wardrobe/providers/` and is the only place that',
                'needs to change — the pipeline does not depend on provider details.',
              ].join('\n'),
            });
