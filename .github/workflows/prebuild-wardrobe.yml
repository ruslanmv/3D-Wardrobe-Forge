name: Prebuild wardrobe

# PB3 (docs/PREBUILT_WARDROBE.md). Every catalog garment for every library character, made
# before anyone asks, into the private bucket the Space reads. A conversation then wears a
# look from storage on the first poll instead of waiting for a job.
#
# Only missing looks are built: Forge remembers each finished look under a key of everything
# that shapes it (wardrobe.pipeline.prebuilt), so a run after one template changed rebuilds that
# template's looks and a run when nothing they depend on changed builds nothing. Bump
# PIPELINE_VERSION in wardrobe/pipeline/prebuilt.py to rebuild everything.
#
# Storage: a private Hugging Face dataset (~11.5 GB for 105 garments x 8 characters; too big
# for git). Forge runs with WARDROBE_STORAGE_BACKEND=hf, so it reads what the dataset already
# has and writes new looks locally; the last step uploads them in one batch.
#
# Settings: the secret HF_TOKEN (already used by deploy-space.yml; needs write access to the
# dataset) and the repository variable WARDROBE_HF_DATASET, e.g. ruslanmv/3d-wardrobe-garments.
# Without either the workflow warns and builds nothing; it never writes looks into the repository.

# PB7. Manual only. A push to main used to start a full build for every character; the
# dataset now holds thousands of looks built over many hours, and a build that runs on its
# own (beside another one, or while Hugging Face is answering badly) is how a character's
# list gets rewritten. Run it from Actions -> Prebuild wardrobe -> Run workflow, on the branch
# whose garments you want built.
# Choice inputs, not booleans: GitHub's mobile site and app draw a boolean input as its label
# with no box to tick (reported 2026-11-20), so a run started from a phone could never turn a
# switch on. A drop-down shows everywhere. Every expression below compares with 'yes'.
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: Only these characters, comma-separated (empty = every available one), e.g. avatar-sample-a
        required: false
        default: ""
      only:
        description: Only templates whose name or id contains this text (empty = all)
        required: false
        default: ""
      overwrite:
        description: Replace looks the dataset already lists with this run's builds (off = keep every existing look, only add new ones)
        required: false
        default: "no"
        type: choice
        options: ["yes", "no"]
      outfits:
        description: Also build every outfit dictionary entry (erotic sets included) on every character
        required: false
        default: "yes"
        type: choice
        options: ["yes", "no"]
      missing_only:
        description: Send only looks a character's list does not have yet (never rebuild an existing one)
        required: false
        default: "yes"
        type: choice
        options: ["yes", "no"]
      private_looks:
        description: Also make every private bare look (tools/prebuild_private.py; all body states and extras sets) on every character declared adult
        required: false
        default: "no"
        type: choice
        options: ["yes", "no"]
      private_presets:
        description: Body-detail presets for the private looks, comma-separated
        required: false
        default: "natural"

concurrency:
  group: prebuild-wardrobe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.slugs.outputs.slugs }}
      enabled: ${{ steps.secrets.outputs.enabled }}
    steps:
      - id: secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DATASET: ${{ vars.WARDROBE_HF_DATASET || 'ruslanmv/3d-wardrobe-garments' }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN is not set; no looks were prebuilt (docs/PREBUILT_WARDROBE.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.secrets.outputs.enabled == 'true'
        run: python -m pip install -e .
      - id: slugs
        if: steps.secrets.outputs.enabled == 'true'
        env:
          ONLY_SLUGS: ${{ inputs.slugs }}
        run: |
          python tools/fetch_library.py
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          from wardrobe.config import get_settings
          from wardrobe.library import AvatarLibrary
          library = AvatarLibrary.from_directory(get_settings().wardrobe_library_root)
          import os
          wanted = {s.strip() for s in os.environ.get("ONLY_SLUGS", "").split(",") if s.strip()}
          slugs = sorted(a.slug for a in library.available() if not wanted or a.slug in wanted)
          print("slugs=" + json.dumps(slugs))
          EOF

  build:
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJson(needs.plan.outputs.slugs) }}
    env:
      WARDROBE_STORAGE_BACKEND: hf
      WARDROBE_HF_DATASET: ${{ vars.WARDROBE_HF_DATASET || 'ruslanmv/3d-wardrobe-garments' }}
      WARDROBE_STORAGE_ROOT: ${{ github.workspace }}/.prebuilt
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[hf,preview]"
      - name: The dataset exists and is private
        run: |
          python -c "from huggingface_hub import create_repo; import os; create_repo(os.environ['WARDROBE_HF_DATASET'], repo_type='dataset', private=True, exist_ok=True)"
      - run: python tools/fetch_library.py
      - name: Forge, signed in as the operator for the full catalog
        run: |
          # A throwaway admin password for this runner only: it lists the adult templates
          # and lives as long as the job. Never printed.
          export WARDROBE_ADMIN_PASSWORD="$(python -c 'import secrets;print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$WARDROBE_ADMIN_PASSWORD"
          # BD21. Bare bodies need the operator switch; on only when this run makes private looks.
          # Every other gate (the character's adult declaration, detail clearance) still decides.
          if [ "${{ inputs.private_looks }}" = "yes" ]; then export WARDROBE_ADULT_BODY_SURFACE=true; fi
          (python -m uvicorn apps.api.main:app --port 8090 > forge.log 2>&1 &)
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8090/health >/dev/null && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:8090/v1/admin/session -H 'content-type: application/json' \
            -d "{\"password\":\"$WARDROBE_ADMIN_PASSWORD\"}" \
            | python -c 'import json,sys;print(json.load(sys.stdin)["token"])' > "$RUNNER_TEMP/forge-token"
      - name: Prebuild ${{ matrix.slug }}
        run: |
          python tools/prebuild.py --forge http://127.0.0.1:8090 \
            --admin-token-file "$RUNNER_TEMP/forge-token" \
            --slugs "${{ matrix.slug }}" ${{ inputs.only && format('--only "{0}"', inputs.only) || '' }} \
            --report "prebuild-${{ matrix.slug }}.json" \
            ${{ inputs.outfits == 'yes' && '--outfits' || '' }} ${{ inputs.missing_only == 'yes' && '--missing-only' || '' }}
      - name: Private looks for ${{ matrix.slug }}
        if: inputs.private_looks == 'yes'
        run: |
          # BD21. Every body state in skin packs, plus the looks with extras, idempotent: a body
          # the character's list already has is not sent again. A gate's refusal is reported in
          # the summary, never worked around.
          python tools/prebuild_private.py --forge http://127.0.0.1:8090 \
            --admin-token-file "$RUNNER_TEMP/forge-token" \
            --slugs "${{ matrix.slug }}" --presets "${{ inputs.private_presets }}" \
            --report "private-${{ matrix.slug }}.json"
      - name: Upload the new looks
        if: always()
        run: |
          # RU4. tools/publish_prebuilt.py (wardrobe.storage.dataset_publish): only looks a
          # prebuilt entry names go up, so nothing unservable reaches the dataset, and each
          # character's list is merged with the dataset's copy by RU1's identity (garment,
          # colour, foundation, privacy and, for an outfit of several garments, its plan) —
          # PB7's rule, unchanged: by default the dataset's entry wins for a look it already
          # lists, and only a manual run with "overwrite" ticked replaces them. A list the
          # dataset cannot be read for right now is held back; the looks still go up. Forge
          # itself has already published in batches while it built (RU3), so this sends the rest.
          if [ -d "$WARDROBE_STORAGE_ROOT/prebuilt" ]; then
            python tools/publish_prebuilt.py --root "$WARDROBE_STORAGE_ROOT" \
              --message "prebuild: ${{ matrix.slug }} at ${{ github.sha }}" \
              ${{ inputs.overwrite == 'yes' && '--overwrite' || '' }}
          fi
      - name: Summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          for path in pathlib.Path(".").glob("private-*.json"):
              r = json.loads(path.read_text())
              print(f"### {path.stem}\n\nplanned {r['planned']}, built {r['built']}, already there "
                    f"{r['present']}, skipped {r['skipped']}, refused {r['refused']}, failed {r['failed']}\n")
              for item in r["results"]:
                  if item["result"] in ("failed", "refused"):
                      print(f"- {item['result']} {item['preset']} {item['look']}: {item.get('reasonCode') or ''} {item.get('reason', '')}")
          for path in pathlib.Path(".").glob("prebuild-*.json"):
              r = json.loads(path.read_text())
              print(f"### {path.stem}\n\nplanned {r['planned']}, built {r['built']}, already there "
                    f"{r['present']}, skipped {r['skipped']}, failed {r['failed']}\n")
              for item in r["results"]:
                  if item["result"] == "failed":
                      print(f"- {item['templateId']}: {item.get('reason', '')}")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prebuild-${{ matrix.slug }}
          path: |
            prebuild-*.json
            private-*.json
            forge.log
