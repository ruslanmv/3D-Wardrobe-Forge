name: Deploy to Hugging Face Space

# The Space (https://huggingface.co/spaces/ruslanmv/3D-Wardrobe-Forge) follows main: every push
# to main is uploaded by deploy/huggingface/deploy.sh, as `make space` does. Needs the repository
# secret HF_TOKEN, a Hugging Face token with write access to the Space.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hidden_source:
        description: "HS1: hide the code (the Space gets a loader only; the code goes to a private repository)"
        required: false
        default: "yes"   # HS1. the code stays hidden by default (verified on the Space 2026-11-21); "no" = the old full upload
        type: choice
        options: ["no", "yes"]

concurrency:
  group: deploy-space
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "huggingface_hub[cli]>=0.34"
      - uses: actions/setup-node@v4   # HS1: the Studio build travels with the hidden code
        if: inputs.hidden_source == 'yes'
        with:
          node-version: "22"
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HIDDEN_SOURCE: ${{ inputs.hidden_source == 'yes' && '1' || '0' }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN secret is not set; the Space was not updated."
            exit 0
          fi
          sh deploy/huggingface/deploy.sh
