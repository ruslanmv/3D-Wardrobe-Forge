name: Blender integration

# Blender plus the VRM add-on is a slow download, so this runs on demand,
# nightly, and whenever the Blender-side code changes.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
  pull_request:
    paths:
      - "worker/blender/**"
      - "wardrobe/engines/blender.py"
      - "Dockerfile.blender"
      - ".github/workflows/blender-integration.yml"

concurrency:
  group: blender-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: "4.2.1"
  BLENDER_SERIES: "4.2"
  VRM_ADDON_VERSION: "2.20.77"

jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Blender runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 \
            libglu1-mesa libsm6 libice6 libxkbcommon0 libegl1 libgomp1

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: /opt/blender
          key: blender-${{ env.BLENDER_VERSION }}-vrm-${{ env.VRM_ADDON_VERSION }}

      - name: Install Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          curl -fsSL -o /tmp/blender.tar.xz \
            "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          sudo mkdir -p /opt/blender
          sudo tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1

      - name: Install the VRM add-on
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          curl -fsSL -o /tmp/vrm-addon.zip \
            "https://github.com/saturday06/VRM-Addon-for-Blender/releases/download/v${VRM_ADDON_VERSION}/VRM_Addon_for_Blender-release.zip"
          sudo mkdir -p "/opt/blender/${BLENDER_SERIES}/scripts/addons"
          sudo python -c "import zipfile; zipfile.ZipFile('/tmp/vrm-addon.zip').extractall('/opt/blender/${BLENDER_SERIES}/scripts/addons')"

      - name: Verify the toolchain
        run: |
          echo "/opt/blender" >> "$GITHUB_PATH"
          /opt/blender/blender --version
          /opt/blender/blender --background --python-expr \
            "import bpy; bpy.ops.preferences.addon_enable(module='io_scene_vrm'); print('VRM importer:', hasattr(bpy.ops.import_scene, 'vrm'))"

      - run: python -m pip install -e ".[dev,preview]"

      - name: Blender engine tests
        env:
          BLENDER_BIN: /opt/blender/blender
        run: pytest tests/blender -v

      - name: End-to-end run through Blender
        env:
          BLENDER_BIN: /opt/blender/blender
        run: |
          python -m apps.cli fixtures --out /tmp/fixtures
          python -m apps.cli create \
            --avatar /tmp/fixtures/calibration-b-medium-vrm1.vrm \
            --prompt "elegant dark red evening dress" \
            --engine blender \
            --out /tmp/blender-output

      - name: Re-import the Blender output and validate it
        run: |
          python - <<'PY'
          import glob, sys
          from wardrobe.vrm.document import GltfDocument
          from wardrobe.vrm.inspect import REQUIRED_HUMANOID_BONES, inspect_document, validate_humanoid

          paths = glob.glob("/tmp/blender-output/*.vrm")
          if not paths:
              sys.exit("Blender produced no VRM")

          document = GltfDocument.from_path(paths[0])
          info = inspect_document(document)
          issues = validate_humanoid(document, info)
          missing = sorted(REQUIRED_HUMANOID_BONES - set(info.humanoid_bones))

          if missing:
              sys.exit(f"output lost humanoid bones: {missing}")
          if issues:
              sys.exit(f"output failed humanoid validation: {issues}")
          print(f"re-imported {paths[0]}: {info.spec}, {len(info.humanoid_bones)} bones, OK")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-output
          path: /tmp/blender-output
          retention-days: 7
