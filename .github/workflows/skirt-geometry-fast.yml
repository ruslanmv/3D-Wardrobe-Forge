name: Skirt geometry regression (fast)
on:
  push:
    branches:
      - fix/skirt-underside-continuous-liners
  workflow_dispatch:

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Run continuous liner geometry regressions
        run: pytest -q tests/unit/test_slip_shorts_panel.py tests/unit/test_skirt_liner.py
